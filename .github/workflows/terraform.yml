name: Terraform AWS Deploy

on:
  push:
    branches:
      - develop

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: "us-east-1"
  AWS_ACCOUNT_ID: "043391333434"
  TF_ACTION: "apply"

jobs:
  terraform:
    runs-on: ubuntu-latest

    steps:
        # Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

        # Set up Java for building the Lambda function
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

        # Build the Lambda function using Maven
      - name: Build Lambda
        working-directory: lambda
        run: mvn clean package

        # Configure AWS credentials using OIDC
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{env.AWS_ACCOUNT_ID}}:role/Github-Actions-Terraform-Role
          aws-region: ${{env.AWS_REGION}}

        # Set up Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

        # Initialize Terraform
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

        # Generate Terraform plan
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

        # Import existing Lambda function in state if destroying
      - name: Terraform Import Lambda
        working-directory: terraform
        if: env.TF_ACTION == 'destroy'
        run: terraform import aws_lambda_function.hello_lambda hello-java-lambda

        # Validate the import lmabda function created the resource in state
      - name: Validate Lambda Import
        working-directory: terraform
        run: |
          if terraform state list | grep -q aws_lambda_function.hello_lambda; then
            echo "Lambda importada"
          else
            echo "Import falhou"
            exit 1
          fi

        # Import existing SQS queue in state if destroying
      - name: Terraform Import SQS
        working-directory: terraform
        if: env.TF_ACTION == 'destroy'
        run: terraform import aws_sqs_queue.hello_queue hello-java-lambda-queue

        # Validate the import SQS queue created the resource in state
      - name: Validate SQS Import
        working-directory: terraform
        run: |
          if terraform state list | grep -q aws_sqs_queue.hello_queue; then
            echo "SQS importada"
          else
            echo "Import falhou"
            exit 1
          fi

        # Apply or destroy Terraform configuration
      - name: Terraform Apply or destroy
        working-directory: terraform
        run: terraform ${{env.TF_ACTION}} -auto-approve
          
        # Validate the SQS queue is destroyed
      - name: Validate SQS Destroyed
        if: env.TF_ACTION == 'destroy'
        run: |
          QUEUE_NAME="hello-queue"

          RESULT=$(aws sqs list-queues --queue-name-prefix "$QUEUE_NAME")

          if echo "$RESULT" | grep -q "$QUEUE_NAME"; then
            echo "❌ SQS ainda existe na AWS"
            exit 1
          else
            echo "✅ SQS destruída com sucesso"
          fi

        # Validate the lambda function is destroyed
      - name: Validate Lambda Destroyed
        if: env.TF_ACTION == 'destroy'
        run: |
          FUNCTION_NAME="hello-java-lambda"

          if aws lambda get-function --function-name "$FUNCTION_NAME" >/dev/null 2>&1; then
            echo "❌ Lambda ainda existe na AWS"
            exit 1
          else
            echo "✅ Lambda destruída com sucesso"
          fi